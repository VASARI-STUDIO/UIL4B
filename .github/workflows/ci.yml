name: CI

# Runs the project's real quality gates — the same commands documented in
# docs/reference/build-and-verify.md, run the same way. No secrets required:
# everything below runs offline against a throwaway "demo-uil4b" Firebase
# project and a local Playwright-driven preview server.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. When an agent pushes three times in ten minutes, the first
# two are cancelled instead of each burning a full Playwright suite. That costs
# nothing in signal: a superseded run is testing code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, build, unit tests, Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Firestore emulator jar is compiled for Java 11+, and firebase-tools 15
      # requires 21+. Set this explicitly rather than relying on the runner's
      # default JDK — do not remove this step.
      - name: Set up JDK 21 (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # 0 errors required. ~34 pre-existing advisory warnings (react-hooks
      # set-state-in-effect / preserve-manual-memoization) are expected and
      # do not fail this step — only lint errors do.
      - name: Lint (eslint)
        run: npx eslint .

      # `npm run build`, NOT `npx vite build`. The two are not the same command:
      # only the npm script runs scripts/prerender.mjs, which is what writes the
      # per-route head metadata and the noindex 404 shell. CI was therefore
      # never exercising the step production actually deploys — a prerender that
      # crashed, or silently stopped matching index.html's tags, would have
      # shipped green. It also means dist/ exists in the shape the unit tests
      # assert against.
      - name: Build (vite + prerender)
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # Spins up the Firestore emulator against the demo-uil4b project (no
      # real credentials, never touches production data) and runs the
      # security-rules suite, including the entitlement-lock regression tests.
      - name: Firestore security rules tests (emulator)
        run: npm run test:rules

  browser-acceptance:
    name: User-simulation acceptance suite (Playwright)
    runs-on: ubuntu-latest
    # Pull requests only. A squash merge lands the tree the PR just tested, and
    # this suite is ~9 minutes against the quality gate's ~1.5 — so re-running it
    # on every push to main doubled the bill for a second opinion on the same
    # code. The quality gate still runs on main, which is what catches semantic
    # conflicts between PRs merged back to back — the case a PR run cannot see.
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same reasoning as the other job: the acceptance suite walks `vite
      # preview` over dist/, so it should walk the build production deploys.
      - name: Build (vite + prerender)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Starts `vite preview` itself (see playwright.config.js) and walks the
      # production build with persona-driven flows. No secrets or external
      # services required.
      - name: User-simulation acceptance tests
        run: npm run test:users

      # Without this a CI-only failure gives no page state to diagnose from —
      # the local run passes and there is nothing to inspect. Playwright writes
      # per-test error context (DOM snapshot at the point of failure) here.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/user-sim/report
          retention-days: 7
