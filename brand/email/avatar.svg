<!--
  UIL4B email avatar — 512x512, for admin@uil4b.com.

  Square, not a circle: Google, Outlook and Apple Mail all crop an avatar to a
  circle THEMSELVES, and each crops to a slightly different radius. Supplying a
  pre-cropped circle on a transparent ground means the platform crops the crop —
  you get a clipped ring and a dark halo where the antialiased edge used to be.
  A full-bleed square survives every one of them.

  The mark is the product's own wordmark on the product's own accent. Nothing
  new was invented here: #0F6FFF is --accent/--brand from global.css, and the
  lettering is the wordmark the nav already shows.

  NOT COPIED FROM favicon.svg ON PURPOSE. That file is a black circle with
  "UI L4B" set in Inter 800 at a -4 tracking, and the founder listed the favicon
  on 2026-09-13 as one of four things that read as AI-generated. Reusing it here
  would spread a mark he has already rejected onto his outbound mail. This uses
  the accent ground and the closed-up wordmark instead — but see README.md: the
  avatar is an identity mark, and identity marks are his call, not an agent's.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UIL4B">
  <rect width="512" height="512" fill="#0F6FFF"/>
  <text
    x="256" y="256"
    font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="150"
    font-weight="700"
    letter-spacing="-7"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="central"
  >UIL4B</text>
</svg>
