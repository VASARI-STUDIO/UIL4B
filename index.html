<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI L4B | Design Toolkit</title>
<meta name="description" content="Free browser-based design toolkit. Colour palettes, type scales, font pairing, icon library, image conversion and video frames.">
<!-- Browser chrome tint (Safari's toolbar, Android Chrome's status bar).
     TWO tags, because #343 made the dark theme reachable and one light value
     now paints the wrong colour behind every dark visitor's status bar.
     These follow the OS, which is the right answer for the 'system' default
     and the ONLY answer available before any script runs.
     A media query cannot read localStorage, so it cannot see an EXPLICIT
     light/dark choice that disagrees with the OS. ThemeContext.jsx installs a
     third, media-less tag ahead of these once it has resolved the three-state
     preference, and that one covers the explicit chooser. Keep both values in
     step with the critical theme block below — they are the same two grounds. -->
<meta name="theme-color" content="#EFEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="UI L4B | Design Toolkit">
<meta property="og:description" content="Free browser-based design toolkit. Colour palettes, type scales, font pairing, icon library, image conversion and video frames.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://uil4b.com">
<meta property="og:site_name" content="UI L4B">
<meta property="og:image" content="https://uil4b.com/previews/og-image.png">
<!-- Every card this site serves is 1200x630 (asserted in tests/unit/share-cards.test.js),
     so these are constants rather than something prerender has to rewrite per
     route. Without them some unfurlers will not commit to the large card and
     fall back to a small square thumbnail, which is the one thing
     summary_large_image is asking them not to do. -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UI L4B Design Toolkit — colour, icon, emoji and imagery tools">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UI L4B | Design Toolkit">
<meta name="twitter:description" content="Free browser-based design toolkit. Colour palettes, type scales, font pairing, icon library, image conversion and video frames.">
<meta name="twitter:image" content="https://uil4b.com/previews/og-image.png">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://uil4b.com/">
<!-- Icons, generated by `npm run icons` (scripts/brand-icons.mjs, which also
     records why the set is this small rather than the usual twenty). The
     manifest names one more file, icon-512.png, which nothing links directly.
     ABSOLUTE hrefs, deliberately. The relative "favicon.svg" this replaces was
     treated by Vite as a bundled asset and fingerprinted into
     /assets/favicon-<hash>.svg, so the icon shipped TWICE — once hashed for
     this tag, once verbatim from public/ — while /favicon.ico, which browsers
     and link scrapers request off the site root on their own, went unanswered. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- The site-level WebApplication JSON-LD, generated at build time from
     src/config/planLadder.js by scripts/site-pricing.mjs, via the
     transformIndexHtml hook in vite.config.js. This block used to hold a
     literal Offer, and it kept quoting the pre-ladder price long after the
     approved ladder moved, so the only price a crawler could read was wrong.
     NEVER type an amount back in here — not even the correct one. Two sources
     of truth for one price IS the defect, and a unit test fails the build if a
     price-shaped string reappears in this file. -->
<!--uil4b:jsonld-->
<!-- Manrope + JetBrains Mono are self-hosted (see the @font-face block at the top
     of global.css for why). Preloaded because a font is only DISCOVERED once the
     stylesheet parses; without this it starts a round trip late and swaps
     mid-entrance. BOTH families are preloaded now: V2 makes mono load-bearing
     above the fold (nav wordmark, eyebrows, stat line), so it is a first-paint
     font rather than a detail font.
     Latin only — latin-ext is rare enough that preloading it would cost every
     visitor bandwidth to save a few. `crossorigin` is required even same-origin:
     fonts are fetched in CORS mode, and a preload without it is fetched twice. -->
<link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Critical theme base — applied before the main stylesheet loads so SVG icons
   (stroke="currentColor") never flash black on dark mode first paint. These
   MUST track --bg-0/--t0 in global.css or the page repaints on stylesheet
   arrival; V2 moved both, so both moved here. */
html[data-theme="dark"]{background:#101012;color:#F2F1EC;color-scheme:dark}
html[data-theme="light"]{background:#EFEEE9;color:#0F0F10;color-scheme:light}
body{background:inherit;color:inherit}
svg{color:inherit}
#root{min-height:100vh}
.boot-shell{min-height:100vh;padding:18px clamp(18px,4vw,48px);font-family:Manrope,system-ui,sans-serif}
.boot-status{position:fixed;left:50%;bottom:18px;z-index:1;transform:translateX(-50%);font-size:11px;font-weight:600;letter-spacing:.04em;color:rgba(71,85,105,.72)}
.boot-nav{display:flex;align-items:center;justify-content:space-between;max-width:1180px;height:52px;margin:0 auto;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:0 16px;background:rgba(255,255,255,.82)}
.boot-mark{font-weight:800;letter-spacing:-.04em}
.boot-nav-lines,.boot-actions{display:flex;gap:10px}
.boot-line,.boot-action,.boot-copy,.boot-card{display:block;background:rgba(100,116,139,.13);overflow:hidden;position:relative}
.boot-line::after,.boot-action::after,.boot-copy::after,.boot-card::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:boot-shimmer 1.4s ease-in-out infinite}
.boot-line{width:72px;height:8px;border-radius:999px}.boot-action{width:76px;height:28px;border-radius:999px}
.boot-main{max-width:980px;margin:0 auto;padding:clamp(72px,12vh,130px) 0 48px;text-align:center}
.boot-kicker{width:180px;height:10px;margin:0 auto 24px}.boot-title{width:min(680px,88%);height:clamp(52px,8vw,86px);margin:0 auto 18px;border-radius:18px}
.boot-sub{width:min(520px,72%);height:14px;margin:0 auto 38px;border-radius:999px}
.boot-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.boot-card{height:132px;border-radius:18px}
html[data-theme="dark"] .boot-nav{background:rgba(18,20,24,.82);border-color:rgba(255,255,255,.1)}
html[data-theme="dark"] .boot-status{color:rgba(203,213,225,.72)}
html[data-theme="dark"] .boot-line,html[data-theme="dark"] .boot-action,html[data-theme="dark"] .boot-copy,html[data-theme="dark"] .boot-card{background:rgba(255,255,255,.09)}
@keyframes boot-shimmer{to{transform:translateX(100%)}}
/* THE HOMEPAGE VARIANT OF THE SHELL. Only scripts/prerender.mjs's `/` output
   carries `.boot-shell-home`, and only that shell paints a real headline —
   every other route keeps the skeleton above, unchanged.
   These three rules do ONE job: get the shell's box chain out of the way so
   `.home-hero`'s own padding is what positions the headline, exactly as it does
   on the hydrated page. `.boot-shell`'s page padding is dropped; the skeleton
   nav becomes `position:fixed` like the real `.pnav` it stands in for, so it is
   out of flow and `.home-hero`'s `calc(var(--nav-top) + var(--nav-h) + …)`
   top padding is the only thing above the h1; and the skeleton strip sits after
   the hero in flow, where it cannot move it. Nothing here styles the headline —
   that is global.css's `.home-hero-h1` block and there is only one of it. */
/* `font-family:inherit` is the load-bearing half of this line. `.boot-shell`
   above declares its own Manrope stack, and a class on a nearer ancestor beats
   `body{font-family:var(--font)}` for everything inside it — so the pre-painted
   headline would inherit a DIFFERENT stack from the one the hydrated headline
   inherits. Both start with Manrope, so both render the same face while the
   self-hosted file loads; they diverge only if it ever fails, which is exactly
   the case where a fallback difference would show as a re-wrap. Inheriting from
   <body> means the two headlines take their family from one declaration rather
   than from two that happen to agree. Measured identical at 360, 390, 480, 768,
   1024, 1280, 1440 and 1920. */
.boot-shell-home{padding:0;font-family:inherit}
/* The paint half of the gate below the theme script. The script REMOVES the
   headline for a visitor who must not see it; this makes it impossible for that
   headline to have painted in the meantime, without depending on when the
   script ran. Inert on the other 38 shells, which carry no `.home-hero`. */
html:not([data-hero-prepainted]) #boot-shell .home-hero{display:none}
.boot-shell-home .boot-nav{position:fixed;top:0;left:0;right:0;z-index:1;max-width:none;height:var(--nav-h,60px);margin:0;border-width:0 0 1px;border-radius:0;padding:0 clamp(18px,4vw,48px)}
.boot-shell-home .boot-below{padding:0 clamp(18px,4vw,48px)}
@media(max-width:640px){.boot-nav-lines{display:none}.boot-main{padding-top:88px}.boot-cards{grid-template-columns:1fr}.boot-card:nth-child(n+2){display:none}}
@media(prefers-reduced-motion:reduce){.boot-line::after,.boot-action::after,.boot-copy::after,.boot-card::after{animation:none}}
html[data-reduced-motion="true"] .boot-line::after,html[data-reduced-motion="true"] .boot-action::after,html[data-reduced-motion="true"] .boot-copy::after,html[data-reduced-motion="true"] .boot-card::after{animation:none}
</style>
<script>
// Apply the resolved theme synchronously, before first paint, so there is no
// light/dark flash (FOUC). THEME IS NOW THREE-STATE, and it follows exactly the
// contract data-reduced-motion has always used one paragraph down:
//
//   vs-t 'light' / 'dark' → an explicit choice; it beats the OS, both ways.
//   vs-t 'system', absent, or junk → no opinion; prefers-color-scheme decides.
//
// html[data-theme] itself is never "system": it is always resolved to a concrete
// 'light' or 'dark', because the whole token layer in global.css is keyed on
// [data-theme="light"] / [data-theme="dark"] and neither set lives on a bare
// :root. Resolving here rather than in CSS is also what keeps the pre-paint
// guarantee — one attribute, written before the stylesheet paints anything.
//
// RETIRED: vs-t-lightreset. It was added on 2026-07-04 with the light-first
// rebuild (#132), whose own comment said "dark returns later as an explicit
// opt-in": a ONE-TIME migration that cleared a stale vs-t=dark left over from
// the pre-rebuild design, because dark was not being maintained at the time.
// Dark has now returned as an explicit opt-in, which is the condition the
// migration was waiting on, so honouring a returning visitor's old choice is
// the correct behaviour rather than a regression. The flag is no longer read or
// written; an inert vs-t-lightreset=1 may linger in old profiles and means
// nothing. Keep this in step with ThemeContext.jsx — the theme is resolved in
// two places and fixing only one brings back the first-paint flip.
//
// data-reduced-motion is THREE-state in the same way. Only a boolean in
// vs-appearance counts as an
// explicit choice; absent one we mirror the OS query. Writing String(!!a.reducedMotion)
// unconditionally — which this line used to do — fabricates an explicit "false"
// for every visitor who has never opened Settings, and by the contract in
// global.css an explicit "false" BEATS `@media (prefers-reduced-motion:reduce)`.
// That single `!!` disabled every reduced-motion rule in the stylesheet app-wide.
// Keep this in step with AppearanceContext.jsx: the same fabricated "false" lived
// in both files, and fixing only one leaves the defect alive.
// EVERY STORAGE READ GETS ITS OWN try/catch, and that is not belt-and-braces.
// localStorage THROWS when storage is blocked (Safari private browsing, "block
// all cookies", a sandboxed iframe). One shared try/catch meant the first throw
// abandoned the whole function — so those visitors got NO data-theme attribute
// at all, and because neither theme's tokens are declared on a bare :root, that
// is an unthemed page rather than a light one. Same reasoning AppearanceContext
// records for its own hardened read: a visitor who cannot persist a choice must
// still get the resolved one.
(function(){try{var r=document.documentElement;var q=function(s){return !!(window.matchMedia&&window.matchMedia(s).matches)};var g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};var t=g('vs-t');if(t!=='dark'&&t!=='light'){t=q('(prefers-color-scheme: dark)')?'dark':'light'}r.setAttribute('data-theme',t);r.setAttribute('data-rounding','default');r.setAttribute('data-density','cozy');var a={};try{a=JSON.parse(g('vs-appearance')||'{}')||{}}catch(e){}var m=typeof a.reducedMotion==='boolean'?a.reducedMotion:q('(prefers-reduced-motion: reduce)');r.setAttribute('data-reduced-motion',String(m))}catch(e){}})();
</script>
<script>
// THE GATE ON THE PRE-PAINTED HEADLINE.
//
// scripts/prerender.mjs writes the homepage's real <h1> into the served `/` and
// `/home` shells and marks those two documents with `data-hero-prepainted`, so
// the largest paint happens with the stylesheet instead of ~1.8s later with the
// entry chunk (LCP 3662ms -> 1698ms mean on scripts/home-field-metrics.mjs's
// profile, 10 cold runs each). See scripts/home-shell.mjs.
//
// TWO VISITORS MUST NOT SEE THAT HEADLINE, and this is where both are answered.
// It runs in the HEAD, before the body is parsed, and the attribute check is
// the first line — so on the other 38 shells it is one `hasAttribute` and out.
//
//   1. A RETURNING SIGNED-IN VISITOR AT `/`. App.jsx does not render the sales
//      page for them; it redirects to their app home, decided synchronously
//      from the `vs-session` hint (src/utils/sessionHint.js) so the correct
//      page is chosen in the first render. The shell cannot run App.jsx, so it
//      asks the same hint the same way. It is deliberately a NARROWER question
//      than rootDestination(): not "where does this visitor go" but "might this
//      document not end up being the sales page", answered conservatively.
//      tests/user-sim/57-signed-in-session.spec.js samples every frame for
//      `.home-hero` and requires it never appears — that contract predates this
//      and still binds.
//
//   2. ANY VISITOR WHO WAS HANDED THE WRONG SHELL. vercel.json rewrites each
//      prerendered URL to its own file, so in production only `/` and `/home`
//      carry this markup. `vite preview` — which the acceptance suite runs
//      against — has no such table and serves dist/index.html for EVERY path,
//      so under the suite /privacy and /create/contrast receive the homepage
//      shell. Rather than trusting a routing table, the shell checks the URL it
//      was actually served at. That also means a future rewrite mistake costs
//      nothing: the page falls back to exactly the skeleton it shipped before.
//
// HOW IT REMOVES IT WITHOUT A FLASH. A MutationObserver callback is a
// microtask, and microtasks run at the end of the parser's task, BEFORE the
// rendering step that would paint the node or fire a requestAnimationFrame
// callback. So the headline is gone before any frame can observe it — which is
// what 57-signed-in-session measures. The `html:not([data-hero-prepainted])`
// rule in the block above is the belt: even if this script never ran, that
// headline cannot paint.
//
// EVERY STORAGE READ IN ITS OWN try/catch, for the reason the theme script
// above records at length: localStorage THROWS on the accessor itself in some
// privacy modes, and one shared catch would abandon the whole function.
(function(){try{var r=document.documentElement;if(!r.hasAttribute('data-hero-prepainted'))return;var p=location.pathname.replace(/\/+$/,'')||'/';var s=false;try{s=localStorage.getItem('vs-session')==='1'}catch(e){}if((p==='/'||p==='/home')&&!s)return;r.removeAttribute('data-hero-prepainted');var mo=new MutationObserver(function(){var h=document.querySelector('#boot-shell .home-hero');if(h){h.remove();mo.disconnect()}});mo.observe(r,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',function(){mo.disconnect()})}catch(e){}})();
</script>
</head>
<body>
<div id="root">
  <div class="boot-shell" id="boot-shell">
    <span class="boot-status" role="status" aria-live="polite">Loading UIL4B</span>
    <div class="boot-decoration" aria-hidden="true">
    <div class="boot-nav">
      <span class="boot-mark">UIL4B</span>
      <span class="boot-nav-lines"><i class="boot-line"></i><i class="boot-line"></i><i class="boot-line"></i></span>
      <span class="boot-actions"><i class="boot-action"></i><i class="boot-action"></i></span>
    </div>
    <div class="boot-main">
      <i class="boot-copy boot-kicker"></i>
      <i class="boot-copy boot-title"></i>
      <i class="boot-copy boot-sub"></i>
      <div class="boot-cards"><i class="boot-card"></i><i class="boot-card"></i><i class="boot-card"></i></div>
    </div>
    </div>
  </div>
</div>
