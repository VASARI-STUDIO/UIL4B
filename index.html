<style>
/* Critical theme base — applied before the main stylesheet loads so SVG icons
   (stroke="currentColor") never flash black on dark mode first paint. */
html[data-theme="dark"]{background:#0A0B0D;color:#e8e8e8;color-scheme:dark}
html[data-theme="light"]{background:#FAFAFA;color:#0A0A0B;color-scheme:light}
body{background:inherit;color:inherit}
svg{color:inherit}
</style>
<script>
// Apply the saved theme synchronously, before first paint, so there is no
// light/dark flash (FOUC). vs-t holds an explicit choice ('dark'|'light');
// absent that we default to light — matching ThemeContext, which also defaults
// to light and never auto-follows the OS. Keeping the two in agreement is what
// kills the first-time visitor theme flip. The rebuilt design ships light-first;
// dark returns later as an explicit opt-in.
(function(){try{var r=document.documentElement;var t=localStorage.getItem('vs-t');if(t!=='dark'&&t!=='light'){t='light'}if(localStorage.getItem('vs-t-lightreset')!=='1'){t='light';localStorage.setItem('vs-t','light');localStorage.setItem('vs-t-lightreset','1')}r.setAttribute('data-theme',t);r.setAttribute('data-rounding','default');r.setAttribute('data-density','cozy');var a=JSON.parse(localStorage.getItem('vs-appearance')||'{}');r.setAttribute('data-reduced-motion',String(!!a.reducedMotion))}catch(e){}})();
</script>
