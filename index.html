<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIL4B — Design Toolkit</title>
<meta name="description" content="Free browser-based design toolkit. Colour palettes, type scales, font pairing, icon library, image conversion, video frames, and production-ready CSS exports.">
<meta name="theme-color" content="#0C0E16">
<meta property="og:title" content="UIL4B — Design Toolkit">
<meta property="og:description" content="Free browser-based design toolkit for colour, typography, imagery, and exports.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.uil4b.com">
<link rel="canonical" href="https://www.uil4b.com">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@700&family=Sora:wght@400;600;700&family=Fraunces:wght@400;700&family=Bricolage+Grotesque:wght@400;700&family=Source+Sans+3:wght@400;600&family=Commissioner:wght@400;500&family=Inter+Tight:wght@400;500&family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Critical theme base — applied before the main stylesheet loads so SVG icons
   (stroke="currentColor") never flash black on dark mode first paint. */
html[data-theme="dark"]{background:#000;color:#e8e8e8;color-scheme:dark}
html[data-theme="light"]{background:#fff;color:#171717;color-scheme:light}
body{background:inherit;color:inherit}
svg{color:inherit}
</style>
</head>
<body>
<script>
// Apply the saved theme synchronously before first paint so icons/colours
// render with the correct theme variables (avoids dark-mode black icon flash).
(function(){try{var v=localStorage.getItem('vs-t-v'),t;if(v!=='2'){t='light'}else{t=localStorage.getItem('vs-t')||'light'}document.documentElement.setAttribute('data-theme',t);var a=JSON.parse(localStorage.getItem('vs-appearance')||'{}');document.documentElement.setAttribute('data-rounding',a.rounding||'default');document.documentElement.setAttribute('data-density',a.density||'cozy')}catch(e){document.documentElement.setAttribute('data-theme','light')}})();
</script>
<div id="root"></div>
<script src="icons-data.js"></script>
<script>window.icons = typeof icons !== 'undefined' ? icons : []; window.CATS = typeof CATS !== 'undefined' ? CATS : {}; window.PACKS = typeof PACKS !== 'undefined' ? PACKS : {};</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
