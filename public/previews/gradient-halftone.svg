<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <style>
      #swatch { display: none }
      #swatch:target { display: inline }
      #swatch:target + rect { display: none }
    </style>
    <!-- The screen angle and dot pitch stay fixed. The underlying tone opens
         and closes the dots across the sheet, from broken ink to solid coverage. -->
    <radialGradient id="dot">
      <stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <pattern id="screen" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)">
      <circle cx="6" cy="6" r="6" fill="url(#dot)"/>
    </pattern>
    <pattern id="coarse" href="#screen" patternTransform="rotate(-17) scale(2.8)"/>
    <radialGradient id="tone" cx=".82" cy="1" r=".95">
      <stop stop-color="#2a2a2a"/><stop offset=".38" stop-color="#555"/><stop offset=".63" stop-color="#888"/>
      <stop offset=".8" stop-color="#aaa"/><stop offset="1" stop-color="#656565"/>
    </radialGradient>
    <filter id="ink" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="luminanceToAlpha"/>
      <feComponentTransfer><feFuncA type="linear" slope="16" intercept="-7.5"/></feComponentTransfer>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <rect width="720" height="420" fill="url(#tone)"/>
    <rect id="swatch" width="720" height="420" fill="url(#coarse)"/>
    <rect width="720" height="420" fill="url(#screen)"/>
  </g>
</svg>
