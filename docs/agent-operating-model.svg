<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" font-family="'Segoe UI',Roboto,system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7a90"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="1280" height="1020" fill="#0b0f17"/>

  <!-- Title -->
  <text x="40" y="46" fill="#3B82F6" font-size="26" font-weight="700">UIL4B — AI Agent Operating Model &amp; Work Flow</text>
  <text x="40" y="72" fill="#93a1b5" font-size="14">How the PM (main Claude thread) parses your instructions and routes work to specialist sub-agents · task-dependent routing · no fixed chain · gated</text>

  <!-- ============ SECTION 1: ROLES ============ -->
  <text x="40" y="118" fill="#e8edf5" font-size="16" font-weight="700">1 · ROLES  —  the PM (you talk to it) + the 10 specialist sub-agents</text>

  <!-- Founder -->
  <rect x="540" y="135" width="200" height="42" rx="9" fill="#1a2233" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="640" y="161" fill="#e8edf5" font-size="15" font-weight="700" text-anchor="middle">FOUNDER  (you)</text>
  <line x1="640" y1="177" x2="640" y2="198" stroke="#6b7a90" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PM -->
  <rect x="400" y="200" width="480" height="58" rx="10" fill="#13233f" stroke="#3B82F6" stroke-width="2"/>
  <text x="640" y="223" fill="#cfe0ff" font-size="15" font-weight="700" text-anchor="middle">PRODUCT MANAGER / ORCHESTRATOR — main Claude thread (the agent you talk to)</text>
  <text x="640" y="244" fill="#93a1b5" font-size="12" text-anchor="middle">parses &amp; re-sequences your instructions · routes per task · merges PRs · NEVER writes code</text>
  <line x1="640" y1="258" x2="640" y2="278" stroke="#6b7a90" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Role boxes row (the 10 agents, grouped by phase) -->
  <g text-anchor="middle">
    <rect x="60"  y="280" width="153" height="46" rx="8" fill="#14211a" stroke="#34d399" stroke-width="1.3"/>
    <text x="136" y="300" fill="#9ff0c8" font-size="11.5" font-weight="700">research</text>
    <text x="136" y="316" fill="#7e8aa0" font-size="9.5">read-only · strategy</text>

    <rect x="227" y="280" width="153" height="46" rx="8" fill="#1a1c2b" stroke="#8b8fd6" stroke-width="1.3"/>
    <text x="303" y="300" fill="#c7c9f5" font-size="11.5" font-weight="700">design · seo</text>
    <text x="303" y="316" fill="#7e8aa0" font-size="9.5">advisory specs</text>

    <rect x="394" y="280" width="153" height="46" rx="8" fill="#211a14" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="470" y="300" fill="#ffd79a" font-size="11.5" font-weight="700">engineer</text>
    <text x="470" y="316" fill="#7e8aa0" font-size="9.5">writes code · builds</text>

    <rect x="561" y="280" width="153" height="46" rx="8" fill="#231a23" stroke="#f472b6" stroke-width="1.3"/>
    <text x="637" y="300" fill="#ffc2e0" font-size="11.5" font-weight="700">reviews</text>
    <text x="637" y="316" fill="#7e8aa0" font-size="9.5">code · security · secret</text>

    <rect x="728" y="280" width="153" height="46" rx="8" fill="#251618" stroke="#fb7185" stroke-width="1.3"/>
    <text x="804" y="300" fill="#ffc4cd" font-size="11.5" font-weight="700">qa</text>
    <text x="804" y="316" fill="#7e8aa0" font-size="9.5">PASS / FAIL gate</text>

    <rect x="895" y="280" width="153" height="46" rx="8" fill="#13233f" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="971" y="300" fill="#bcd6ff" font-size="11.5" font-weight="700">release-captain</text>
    <text x="971" y="316" fill="#7e8aa0" font-size="9.5">GO/NO-GO · PR prep</text>

    <rect x="1062" y="280" width="153" height="46" rx="8" fill="#15202c" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="1138" y="300" fill="#aee3ff" font-size="11.5" font-weight="700">analytics</text>
    <text x="1138" y="316" fill="#7e8aa0" font-size="9.5">advisory · scoped</text>
  </g>

  <!-- ============ SECTION 2: WORK FLOW ============ -->
  <line x1="40" y1="356" x2="1240" y2="356" stroke="#1e2735" stroke-width="1"/>
  <text x="40" y="384" fill="#e8edf5" font-size="16" font-weight="700">2 · WORK FLOW  —  how a request travels (the route depends on the task)</text>

  <!-- spine center x = 470 -->
  <!-- Founder request -->
  <rect x="330" y="402" width="280" height="40" rx="9" fill="#1a2233" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="470" y="427" fill="#e8edf5" font-size="14" font-weight="700" text-anchor="middle">Founder request</text>
  <line x1="470" y1="442" x2="470" y2="462" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- PM parse/route -->
  <rect x="290" y="464" width="360" height="46" rx="9" fill="#13233f" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="470" y="486" fill="#cfe0ff" font-size="13.5" font-weight="700" text-anchor="middle">PM · parse → re-sequence → route</text>
  <text x="470" y="503" fill="#93a1b5" font-size="11" text-anchor="middle">task-dependent · no fixed chain · fewest agents that fit</text>
  <line x1="470" y1="510" x2="470" y2="532" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="662" y="526" fill="#f4a3c4" font-size="11" font-style="italic">flag Human Validation Zones for approval</text>

  <!-- ROUTE fan-out: advisory vs implementation -->
  <rect x="150" y="534" width="640" height="100" rx="10" fill="#0f1722" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="470" y="554" fill="#cfe0ff" font-size="12.5" font-weight="700" text-anchor="middle">▼ ROUTE to the fewest specialist agents the task needs</text>
  <rect x="168" y="564" width="300" height="52" rx="7" fill="#14211a" stroke="#34d399" stroke-width="1.2"/>
  <text x="318" y="583" fill="#9ff0c8" font-size="11.5" font-weight="700" text-anchor="middle">ADVISORY · read-only</text>
  <text x="318" y="601" fill="#9fb4a8" font-size="9.5" text-anchor="middle">research · design · seo · analytics → specs/reports (no build)</text>
  <rect x="478" y="564" width="294" height="52" rx="7" fill="#211a14" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="625" y="583" fill="#ffd79a" font-size="11.5" font-weight="700" text-anchor="middle">IMPLEMENTATION</text>
  <text x="625" y="601" fill="#c4b08f" font-size="9.5" text-anchor="middle">engineer → scoped writes · verifies npx vite build + eslint</text>
  <text x="470" y="628" fill="#7e8aa0" font-size="10.5" text-anchor="middle">advisory tasks usually stop here → PM relays · code changes continue to the gates ▼</text>
  <line x1="470" y1="634" x2="470" y2="656" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- PRE-SHIP GATES -->
  <rect x="150" y="658" width="640" height="76" rx="10" fill="#1a1018" stroke="#f472b6" stroke-width="1.4"/>
  <text x="470" y="678" fill="#ffc2e0" font-size="12.5" font-weight="700" text-anchor="middle">▼ PRE-SHIP GATES · code changes only — run together</text>
  <g text-anchor="middle" font-size="10.5" fill="#f3c6dd">
    <rect x="168" y="688" width="196" height="32" rx="6" fill="#2a131f" stroke="#9c3a68"/><text x="266" y="708">code-reviewer</text>
    <rect x="380" y="688" width="196" height="32" rx="6" fill="#2a131f" stroke="#9c3a68"/><text x="478" y="708">security-reviewer</text>
    <rect x="592" y="688" width="196" height="32" rx="6" fill="#2a131f" stroke="#9c3a68"/><text x="690" y="708">secret-scanner</text>
  </g>
  <text x="470" y="729" fill="#c98ba8" font-size="10.5" text-anchor="middle">BLOCK on any CRITICAL (or a red build) = hard NO-GO</text>
  <line x1="470" y1="734" x2="470" y2="756" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- qa gate -->
  <rect x="290" y="758" width="360" height="44" rx="9" fill="#251618" stroke="#fb7185" stroke-width="1.6"/>
  <text x="470" y="780" fill="#ffc4cd" font-size="13.5" font-weight="700" text-anchor="middle">qa · functional gate</text>
  <text x="470" y="796" fill="#d29aa3" font-size="11" text-anchor="middle">PASS / FAIL — responsive · a11y · UX states · SEO/meta</text>
  <line x1="470" y1="802" x2="470" y2="824" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- release-captain -->
  <rect x="270" y="826" width="400" height="44" rx="9" fill="#13233f" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="470" y="848" fill="#bcd6ff" font-size="13.5" font-weight="700" text-anchor="middle">release-captain · GO / NO-GO + prepared PR</text>
  <text x="470" y="864" fill="#93a1b5" font-size="11" text-anchor="middle">when a PR is requested — hands off to the PM</text>
  <line x1="470" y1="870" x2="470" y2="892" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- PM merge -->
  <rect x="300" y="894" width="340" height="40" rx="9" fill="#13233f" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="470" y="919" fill="#cfe0ff" font-size="13" font-weight="700" text-anchor="middle">PM · open + squash-merge PR (GitHub MCP)</text>
  <line x1="470" y1="934" x2="470" y2="954" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- report -->
  <rect x="300" y="956" width="340" height="42" rx="9" fill="#1a2233" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="470" y="977" fill="#e8edf5" font-size="13" font-weight="700" text-anchor="middle">PM · report + decision list → Founder</text>
  <text x="470" y="992" fill="#93a1b5" font-size="11" text-anchor="middle">loops back for the next request</text>

  <!-- ===== Right-side principles panel ===== -->
  <rect x="830" y="402" width="410" height="596" rx="12" fill="#0e141f" stroke="#1e2735" stroke-width="1.2"/>
  <text x="852" y="432" fill="#3B82F6" font-size="15" font-weight="700">Operating principles</text>

  <g font-size="12.5">
    <text x="852" y="464" fill="#cfe0ff" font-weight="700">PM never writes code</text>
    <text x="852" y="483" fill="#b9c4d4">All implementation goes to the engineer. The</text>
    <text x="852" y="501" fill="#b9c4d4">PM parses, routes, verifies, reports, merges.</text>

    <text x="852" y="533" fill="#9ff0c8" font-weight="700">Task-dependent routing</text>
    <text x="852" y="552" fill="#b9c4d4">No fixed chain. Use the fewest agents that do</text>
    <text x="852" y="570" fill="#b9c4d4">the job; advisory tasks often need just one.</text>

    <text x="852" y="602" fill="#bcd6ff" font-weight="700">Hub-and-spoke</text>
    <text x="852" y="621" fill="#b9c4d4">Sub-agents never talk to each other —</text>
    <text x="852" y="639" fill="#b9c4d4">the PM is the only integrator.</text>

    <text x="852" y="671" fill="#ffd79a" font-weight="700">Verify-first gate</text>
    <text x="852" y="690" fill="#b9c4d4">The engineer verifies with npx vite build +</text>
    <text x="852" y="708" fill="#b9c4d4">eslint. Nothing ships without a green build.</text>
    <text x="852" y="726" fill="#b9c4d4">BLOCK on any CRITICAL.</text>

    <text x="852" y="758" fill="#f4a3c4" font-weight="700">Human Validation Zones</text>
    <text x="852" y="777" fill="#b9c4d4">Auth core + Stripe + firebase.js: flag blast</text>
    <text x="852" y="795" fill="#b9c4d4">radius; edit only with founder approval.</text>

    <text x="852" y="827" fill="#9ff0c8" font-weight="700">Quality &gt; quantity</text>
    <text x="852" y="846" fill="#b9c4d4">No micro-busywork; flag risk rather than</text>
    <text x="852" y="864" fill="#b9c4d4">ship something half-verified.</text>

    <text x="852" y="912" fill="#6b7a90" font-size="11" font-style="italic">Roster: research · design · seo · engineer · code /</text>
    <text x="852" y="928" fill="#6b7a90" font-size="11" font-style="italic">security / secret review · qa · release-captain · analytics.</text>
    <text x="852" y="952" fill="#6b7a90" font-size="11" font-style="italic">Routing rules: docs/reference/project-manager.md</text>
  </g>
</svg>
